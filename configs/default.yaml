# 配置说明：值为 "env:VAR" 的字段从环境变量读取，避免密钥落盘。

paths:
  raw: data/raw
  parsed: data/parsed
  eval: data/eval

feishu:
  enabled: false # 待企业自建应用权限（PLAN §9 行动项 2）
  app_id: ""
  app_secret: ""
  root_folder_token: ""

embedding:
  # BGE-M3 via OpenAI 兼容 API（如 SiliconFlow）；开工首日实测是否返回 sparse 权重（PLAN §8）
  base_url: env:DOC_RAG_EMBEDDING_BASE_URL
  api_key: env:DOC_RAG_EMBEDDING_API_KEY
  model: BAAI/bge-m3
  dense_dim: 1024
  sparse: true

llm:
  base_url: env:DOC_RAG_LLM_BASE_URL
  api_key: env:DOC_RAG_LLM_API_KEY
  model: env:DOC_RAG_LLM_MODEL # judge 与合成同源（PLAN §5.3 评估可信度口径）
  temperature: 0.0
  cache: true # 本地响应缓存（.cache/llm_cache.sqlite）：同 prompt 重跑零成本
  # OpenRouter 建议带归因头（可选）；换回 DeepSeek 官方时删掉本段
  headers:
    HTTP-Referer: https://github.com/wabcyyyy/quant-rag
    X-Title: doc-rag

qdrant:
  url: http://localhost:6333
  collection: doc_rag_demo

retrieval:
  k_dense: 20
  k_bm25: 20
  rrf_k: 60 # RRF 平滑常数（当前由 Qdrant 服务端实现；留作调参备忘）
  fusion_limit: 12 # 融合后送下游（Rerank/合成）的块数
  aggregate_pool: 50 # 聚合检索的候选池
  aggregate_top_n: 25 # 聚合题自动放宽后的预算（实测覆盖率随预算单调上升）
  max_contexts: 10 # 送入 LLM 的上下文块数上限（控制输入 token；重排后通常更少）
  rerank_top_n: 6
  parent_expand: true

rerank:
  enabled: true
  base_url: env:DOC_RAG_EMBEDDING_BASE_URL # SiliconFlow 同源
  api_key: env:DOC_RAG_EMBEDDING_API_KEY
  model: BAAI/bge-reranker-v2-m3
  top_n: 6 # 重排后送进合成的块数（削减上下文噪声 → Faithfulness）

metadata_extraction:
  enabled: true
  fields: [date, meeting_type, attendees, topics, decisions]

eval:
  gold_file: data/eval/gold.json
  ragas_sample: 15 # RAGAS 抽样条数（0=全量）；均匀覆盖全表，不能取前 N 条——黄金集按题型分块排序，取前 N 会整段漏掉末尾题型
  ragas_metrics: [faithfulness] # answer_relevancy 中文场景噪声大（实测 0.40 但答案明显切题），默认关
  judge:
    temperature: 0.0
