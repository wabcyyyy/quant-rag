# 配置说明：值为 "env:VAR" 的字段从环境变量读取，避免密钥落盘。

paths:
  raw: data/raw
  parsed: data/parsed
  eval: data/eval

embedding:
  # BGE-M3 via OpenAI 兼容 API（如 SiliconFlow）。实测响应不含 learned-sparse 字段
  # （`doc-rag check` 会打印这个结论），所以稀疏路走 Qdrant 内置 BM25；
  # 这里不留 `sparse` 开关——没有代码读它，留着就是配置在宣称一个不存在的能力。
  base_url: env:DOC_RAG_EMBEDDING_BASE_URL
  api_key: env:DOC_RAG_EMBEDDING_API_KEY
  model: BAAI/bge-m3
  dense_dim: 1024

llm:
  base_url: env:DOC_RAG_LLM_BASE_URL
  api_key: env:DOC_RAG_LLM_API_KEY
  model: env:DOC_RAG_LLM_MODEL # 默认与合成同源；judge 可单指一家（PLAN §5.3「judge 自偏」）
  temperature: 0.0
  cache: true # 本地响应缓存（.cache/llm_cache.sqlite）：同 prompt 重跑零成本
  # 合成侧的思考开关。默认空 = 保持现状（开思考，质量优先）。
  # 设 none 可砍掉推理型模型看不见的 reasoning token——实测它占输出 93%，
  # 是聚合题端到端 25~34s 的主因（PLAN「延迟实测」）。**会改变答案，作废现有基线**。
  # 空串是 falsy，不会进请求参数，所以默认行为与改动前逐字一致。
  reasoning_effort: env:DOC_RAG_LLM_REASONING_EFFORT
  # 聚合题专用档：cross_doc/time_filter 关思考实测两项指标都无损失
  # （包含匹配 1.00→1.00、Faithfulness 0.936→0.979 / 1.00→0.975，n=13），
  # 而端到端 24~32s → 2s——全项目性价比最高的延迟交易；其余题型关思考
  # 忠实度 −6~−21pt，必须保留思考。不配则回落到上面的全局值。
  # 推荐组合：全局留空（其余题型保质量）+ 此处设 none（聚合题砍 30s 级尾部）。
  reasoning_effort_aggregate: env:DOC_RAG_LLM_REASONING_EFFORT_AGGREGATE
  # 归因头只有 OpenRouter 需要，而默认端点是 DeepSeek 官方——所以这里不放实例值，
  # 留着就是每次请求往官方 API 多带一个 GitHub 地址。换 OpenRouter 时自行加
  # `headers: {HTTP-Referer: <你的仓库>, X-Title: doc-rag}`：整棵子树原样透传给 SDK，
  # 且改写侧换供应商时会主动丢掉它（见 retrieve/rewrite_llm.py 与 test_rewrite_llm）。

qdrant:
  url: http://localhost:6333
  collection: doc_rag_demo

api:
  # FastAPI 鉴权令牌。空 = /query 与 /query/stream 一律 503（拒绝服务而不是裸奔）。
  auth_token: env:DOC_RAG_API_TOKEN
  # kb 参数的白名单。不做白名单等于把「同一 Qdrant 实例上的任意 collection」
  # 暴露给调用方——改造前 `retriever.collection = body.kb` 连这个边界都没有。
  allowed_collections: [doc_rag_demo, doc_rag_sample]
  # 每个令牌每分钟允许的问答次数（进程内滑动窗口）。推理型模型单请求可占住
  # 线程池槽位到 180s，没限流时几个慢请求就能把服务拖死。0 = 不限流。
  rate_limit_rpm: 30
  # CORS 有意不开：这是个带令牌的知识库接口，浏览器直连只会把令牌摊到前端。
  # 要做 Web 界面就走同源反向代理，或让 Gradio 演示页承担交互层。

retrieval:
  k_dense: 20
  k_bm25: 20
  fusion_limit: 12 # 融合后送下游（Rerank/合成）的块数
  aggregate_pool: 50 # 聚合检索的候选池
  aggregate_top_n: 25 # 聚合题自动放宽后的预算（实测覆盖率随预算单调上升）
  max_contexts: 10 # 送入 LLM 的上下文块数上限（控制输入 token；重排后通常更少）

rewrite:
  # 查询改写（LLM 版）参数。关/开由调用方的 --rewrite / --no-rewrite 决定，
  # 这里不再放第二个开关（两个真值来源迟早互相打脸）。
  temperature: 0.0
  # 改写是意图分类，不需要思考：推理型模型会把输出预算几乎全花在看不见的
  # reasoning token 上（同 judge 的实测结论），而它现在在每次请求的关键路径上。
  reasoning_effort: none
  # ── 关键路径预算（与合成侧分开的唯一理由）───────────────────────────────
  # 合成侧是「180s 超时 × 4 次重试」——给能生成几十秒的聚合答案用的。照搬到一次
  # 分类上，最坏就是 180+2+180+4+180+8+180 ≈ 12 分钟的等待能力，而它失败本来
  # 就该退化成「不改写」。
  # 实测改写延迟（deepseek-flash · 关思考 · 关缓存 · 4 轮各 n=30）：
  #   p50 632 / 643 / 687 / 817ms · p95 0.84~1.15s · max 1.31s
  # 5s = 观测最大值的 4 倍余量；两次尝试最坏 5+2+5=12s，之后退化并计数。
  timeout_s: 5
  max_attempts: 2
  # ── 改写模型可以和合成模型不同源（留空 = 继承 llm 那一份）────────────────
  # 2026-09-19 实测过「换更小/更近的模型砍延迟」：同 30 条泛化门禁题、关缓存
  # （延迟列为单次观测，deepseek-flash 另有两轮 = p50 687 / 632ms）：
  #   deepseek-flash      p50 643ms · p95 1.02s · recall 0.95（3 轮一致）· 误触发 0.10
  #   Qwen3-30B-A3B-Inst  p50 1010ms · p95 3.21s · recall 1.00 · 误触发 0.20
  #   Qwen2.5-7B-Instruct p50 755ms · p95 1.93s · recall 1.00 · 误触发 0.20
  #   Qwen3.5-4B          单次 21~46s（reasoning_effort=none 对它无效，照样思考）
  # 结论：更小不等于更快，DeepSeek 官方也没有比 flash 更小的档（只有 v4-pro）；
  # 换模型会把延迟推到 1.2~1.6 倍、误触发翻倍，所以默认不换。这三个键留着，
  # 是因为「改写花延迟预算、合成花质量预算」这个拆分本身成立——要换就得连着
  # `doc-rag check-rewrite` 的门禁一起量，门禁会打印模型名和延迟。
  model: ""
  base_url: ""
  api_key: ""

rerank:
  enabled: true
  base_url: env:DOC_RAG_EMBEDDING_BASE_URL # SiliconFlow 同源
  api_key: env:DOC_RAG_EMBEDDING_API_KEY
  model: BAAI/bge-reranker-v2-m3
  # 送进合成的块数上限。**只是上下文预算**：重排现在返回全量重排清单，
  # 检索指标（Hit@k / MRR / nDCG / 覆盖率）在那份完整清单上算，两臂才等长可比。
  # 它以前兼做清单截断，于是「有重排」臂在 6 条上算指标、对照臂在 8 条上算。
  top_n: 6

agent:
  # Agentic RAG 的 policy 层（PLAN §5.5 / docs/design/AGENTIC_RAG.md）。
  # 默认 false：单发路径是所有已公布基线数字的载体，而 E2（上下文预算消融）还没跑——
  # 它是本计划的 go/no-go。所以「开 agent」必须是显式动作：部署改这里，
  # 评估臂走 `mode="agent"`，两条来源都会落进 trace 的 mode_explicit。
  enabled: false
  # 分题型开关是本期唯一的成本控制面，所以它是配置而不是代码常量。
  # 键的是**预测**题型（由改写的 aggregate / year 推出来，见 agent.predict_type）：
  # 真题型只在黄金集里存在，拿它当开关会让五条入口的 trace 不可比。
  types: [cross_doc, time_filter]
  # 步数上限。含第 1 轮判定——max_steps=1 等于「判一次就不许再查」，白付那一次调用，
  # 所以代码把它夹在 [1, 3]（PLAN §2 的边界就是 ≤3）。
  max_steps: 3
  # 每轮判定能看到的上下文块数。并集后 prompt 递增：第 3 步的输入是第 1 步的 2~3 倍，
  # 而长上下文请求实测会撞超时（eval.judge.timeout_s 60→180 就是这么来的）。
  judge_contexts: 6
  # 多步并集送进合成的块数上限。**它替换**单发口径的 min(max_contexts, rerank.top_n)=6，
  # 因为砍回 6 块就把这层存在的理由砍掉了。代价：faithfulness 随上下文变长单调走高，
  # 所以 agent 臂必须配一条同块数对照臂才准进答案轨结论（PLAN §5.5 门槛 2）。
  max_contexts: 12
  # 按 token 封顶，不只是按步数（步数封顶不够：每步的输入长度本身在长）。
  # 12000 是数量级护栏不是精算值——判定 prompt 6 块 × 每块几百字，第 3 轮大概到顶。
  max_prompt_tokens: 12000
  # 判定调用自己的预算。沿用改写侧 W3 的教训：可退化的步骤不该有 180s×4 的等待能力，
  # 判定挂了退化成「按证据已足够停下」，宁停不猜。
  timeout_s: 20
  max_attempts: 1

metadata_extraction:
  # LLM 元数据抽取的总开关（index_parsed 缺省时读这里）。
  # 保持 false：这是 1 次/文档 = 1130 次调用的最大成本单点（PLAN §8），
  # 文件名信号已覆盖日期/大类。要用必须显式 `ingest --llm-meta` 或改这里。
  enabled: false
  # 抽取字段固定为 prompts.METADATA_EXTRACTION 里那五个；不在这里列一遍，
  # 否则改提示词时会出现「配置说抽 6 个、提示词只抽 5 个」的第二份事实来源。

eval:
  gold_file: data/eval/gold.json
  ragas_sample: 15 # RAGAS 抽样条数（0=全量）；均匀覆盖全表，不能取前 N 条——黄金集按题型分块排序，取前 N 会整段漏掉末尾题型
  ragas_metrics: [faithfulness] # answer_relevancy 中文场景噪声大（实测 0.40 但答案明显切题），默认关
  judge:
    temperature: 0.0
    # 关掉 judge 的思考：拆陈述/逐条判定不需要推理，但推理型模型会把输出预算的
    # 97% 花在看不见的 reasoning token 上（实测单次 1554 → 79）。同模型、不改 judge 身份。
    reasoning_effort: none
    # ── judge 可以和生成不同源（留空 = 继承 llm 那一份）──────────────────────
    # 默认同源是省配置的取舍，但它意味着「LLM 打分」这条轨上没有任何独立视角。
    # `doc-rag audit-refusals` 支持换到这里，用来回答「换个 judge 结论会不会翻」；
    # 实测结果与结论见 PLAN §5.3「judge 自偏」。**换 judge 就是换度量身份**：
    # 只有同一批落盘答案上的判读差异可比，跨 judge 的绝对分数不可混用。
    model: env:DOC_RAG_JUDGE_MODEL # 留空 = 继承 llm.model（同源判分）
    base_url: env:DOC_RAG_JUDGE_BASE_URL # 留空 = 继承 llm.base_url
    api_key: env:DOC_RAG_JUDGE_API_KEY # 指向 embedding 那家时留空即可（同账号 key 复用，见 eval/judge.py）
    timeout_s: 180  # 判分不卡在关键路径上，但也不该继承合成侧的 180s×4 次重试
    # 180 不是拍脑袋：跨供应商复判（SiliconFlow Qwen3-30B）实测 60s 会在 8 并发下
    # 掐断最长上下文那批条目（time_filter 12 条里 6 条超时），缺失集中在同一题型 →
    # 均值就被幸存者拉高。放宽到 180 补齐之后再看结论（PLAN §5.3「judge 自偏」）。
    max_attempts: 2
